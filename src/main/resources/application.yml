spring:
  application:
    name: InfiniteChat-Agent
  mail:
    host: smtp.qq.com  # 以QQ邮箱为例
    port: 587
    username: 2631266284@qq.com # 你的发件账号
    password: ${SMTP_KEY} # 你的SMTP授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 10010
  servlet:
    context-path: /api

logging:
  level:
    dev.langchain4j.mcp: ERROR

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY}
      embedding-model:
        model-name: text-embedding-v4
        api-key: ${DASHSCOPE_API_KEY}
      streaming-chat-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY}

bigmodel:
  api-key: ${BIGMODEL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always